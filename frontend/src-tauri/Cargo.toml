[package]
name = "kid-climber"
version = "3.0.0-alpha.3"
description = "攀爬架结构设计软件"
authors = ["Kid Climber contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/rightone/kid-climber"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "=1.6.8", features = ["shell-open", "process-command-api", "fs-all", "path-all", "window-all", "dialog-all", "http-all", "notification-all", "global-shortcut-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
